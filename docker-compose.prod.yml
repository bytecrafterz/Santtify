# Produção. Sobe com:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Ver deploy/README.md para o passo a passo completo no servidor.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem portas publicadas: o banco só é alcançável pela rede interna do
    # compose. Postgres exposto na internet é como a maioria dos vazamentos
    # começa.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      PRIVACY_HASH_SALT: ${PRIVACY_HASH_SALT}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-1095}
      CONSENT_POLICY_VERSION: ${CONSENT_POLICY_VERSION:-1.0.0}
      PUBLIC_WEB_URL: https://${DOMINIO}
      PUBLIC_API_URL: https://${DOMINIO}
      PUBLIC_SHORTLINK_BASE: https://${DOMINIO}/r
      UPLOAD_DIR: /app/uploads
    volumes:
      # Volume nomeado: as músicas e áudios do cliente sobrevivem a
      # `docker compose down` e a qualquer rebuild da imagem.
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Variáveis NEXT_PUBLIC_* são gravadas DENTRO do JavaScript no build.
        # Mudar qualquer uma exige rebuild da imagem, não basta reiniciar.
        NEXT_PUBLIC_API_URL: https://${DOMINIO}/api
        NEXT_PUBLIC_PROJETO_PADRAO: ${NEXT_PUBLIC_PROJETO_PADRAO:-jesus-alfabeto-saudavel}
        NEXT_PUBLIC_WHATSAPP_PV: ${NEXT_PUBLIC_WHATSAPP_PV:-}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados — perder isto refaz o Let's Encrypt
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
      - web

  # Backup diário do banco.
  #
  # Existe desde o primeiro dia de propósito: o log de eventos é a prova
  # comercial do Produto Vivo, e é o único dado do projeto que não pode ser
  # recriado. Perder o banco depois do lançamento significa perder o Dia Zero.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ['/bin/sh', '/backup.sh']

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
  caddy_logs:
